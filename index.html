<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CalcFlow</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gray-100 flex items-center justify-center">

    <main class="bg-white p-6 rounded-2xl shadow-lg w-80">

        <h1 class="text-2xl font-bold text-center mb-4">
            CalcFlow
        </h1>

        <input
            id="display"
            type="text"
            value="0"
            readonly
            class="w-full bg-gray-100 text-right text-3xl p-4 rounded-lg mb-4"
        >

        <div class="grid grid-cols-3 gap-3">

            <button data-number="7" class="number-btn bg-gray-200 p-4 rounded-lg text-xl">
                7
            </button>

            <button data-number="8" class="number-btn bg-gray-200 p-4 rounded-lg text-xl">
                8
            </button>

            <button data-number="9" class="number-btn bg-gray-200 p-4 rounded-lg text-xl">
                9
            </button>

            <button data-number="4" class="number-btn bg-gray-200 p-4 rounded-lg text-xl">
                4
            </button>

            <button data-number="5" class="number-btn bg-gray-200 p-4 rounded-lg text-xl">
                5
            </button>

            <button data-number="6" class="number-btn bg-gray-200 p-4 rounded-lg text-xl">
                6
            </button>

            <button data-number="1" class="number-btn bg-gray-200 p-4 rounded-lg text-xl">
                1
            </button>

            <button data-number="2" class="number-btn bg-gray-200 p-4 rounded-lg text-xl">
                2
            </button>

            <button data-number="3" class="number-btn bg-gray-200 p-4 rounded-lg text-xl">
                3
            </button>

            <button data-number="0" class="number-btn bg-gray-200 p-4 rounded-lg text-xl col-span-2">
                0
            </button>

            <button data-number="." class="number-btn bg-gray-200 p-4 rounded-lg text-xl">
                .
            </button>

        </div>

    </main>
    <script src="calculator.js"></script>
    <script src="script.js"></script>

</body>
</html>
